server.port=8080
spring.application.name=velora-api-gateway
spring.main.web-application-type=reactive

# Gateway HTTP Client Timeouts
spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=5s

# Resilience4J Configuration
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.configs.default.timeout-duration=5s

# Global CORS Configuration (Handled by GatewayConfig.java to avoid duplicates)
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=false

# Auth Service Route
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=name=authCB,fallbackUri=forward:/fallback/auth

# User Service Route
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=${USER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=name=userCB,fallbackUri=forward:/fallback/user

# Safety Service Route
spring.cloud.gateway.routes[2].id=safety-service
spring.cloud.gateway.routes[2].uri=${SAFETY_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/safety/**
spring.cloud.gateway.routes[2].filters[0]=CircuitBreaker=name=safetyCB,fallbackUri=forward:/fallback/safety

# AI Service Route
spring.cloud.gateway.routes[3].id=ai-service
spring.cloud.gateway.routes[3].uri=${AI_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/ai/**
spring.cloud.gateway.routes[3].filters[0]=CircuitBreaker=name=aiCB,fallbackUri=forward:/fallback/ai

# Map Service Route
spring.cloud.gateway.routes[4].id=map-service
spring.cloud.gateway.routes[4].uri=${MAP_SERVICE_URL:${AI_SERVICE_URL:http://localhost:8084}}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/map/**
spring.cloud.gateway.routes[4].filters[0]=CircuitBreaker=name=mapCB,fallbackUri=forward:/fallback/map

# Notification Service Route
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[5].filters[0]=CircuitBreaker=name=notificationCB,fallbackUri=forward:/fallback/notification

# Police Service Route
spring.cloud.gateway.routes[6].id=police-service
spring.cloud.gateway.routes[6].uri=${POLICE_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/police/**
spring.cloud.gateway.routes[6].filters[0]=CircuitBreaker=name=policeCB,fallbackUri=forward:/fallback/police

# Admin Service Route
spring.cloud.gateway.routes[7].id=admin-service
spring.cloud.gateway.routes[7].uri=${ADMIN_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/admin/**
spring.cloud.gateway.routes[7].filters[0]=CircuitBreaker=name=adminCB,fallbackUri=forward:/fallback/admin

# File Upload Route
spring.cloud.gateway.routes[8].id=files-service
spring.cloud.gateway.routes[8].uri=${FILES_SERVICE_URL:${SAFETY_SERVICE_URL:http://localhost:8083}}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/files/**
spring.cloud.gateway.routes[8].filters[0]=CircuitBreaker=name=filesCB,fallbackUri=forward:/fallback/files

# Complaint Service Route
spring.cloud.gateway.routes[9].id=complaint-service
spring.cloud.gateway.routes[9].uri=${COMPLAINT_SERVICE_URL:http://localhost:8088}
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/complaints/**,/api/v1/complaints/**
spring.cloud.gateway.routes[9].filters[0]=CircuitBreaker=name=complaintCB,fallbackUri=forward:/fallback/complaint
spring.cloud.gateway.routes[9].filters[1]=RewritePath=/api/v1/complaints/?(?<segment>.*), /api/complaints/$\{segment}

velora.jwt.secret=${JWT_SECRET:vEloRa$uPeR$eCrEtKeyForJWT2024PlatformWomenSafety!@#$%^&*()}
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.velora=DEBUG

