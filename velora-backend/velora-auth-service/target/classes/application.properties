server.port=8081
spring.application.name=velora-auth-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/velora_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:velora.noreply@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

velora.jwt.secret=${JWT_SECRET:vEloRa$uPeR$eCrEtKeyForJWT2024PlatformWomenSafety!@#$%^&*()}
velora.jwt.access-token-expiry-ms=900000
velora.jwt.refresh-token-expiry-ms=604800000
velora.otp.expiry-minutes=10

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.velora=DEBUG
logging.level.org.springframework.security=INFO
